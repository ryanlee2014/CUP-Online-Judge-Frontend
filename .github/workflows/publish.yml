name: Publish releases to CDN repository

on:
  push:
    branches:
      - typescript
    paths:
      - 'package.json'
      - 'src/**'
      - '.github/**'
      - 'public/**'
      - 'vue.config.js'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'ryanlee2014/CUP-Online-Judge-Frontend'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        name: Checkout code
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 1

      - name: Build env
        run: |
          if [ -f NEED_BUILD ]; then
            echo "NEED_BUILD=$(cat NEED_BUILD)" >> $GITHUB_ENV
          else
            echo "NEED_BUILD=false" >> $GITHUB_ENV
          fi

      - name: Use Node.js environment
        if: env.NEED_BUILD == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache build tool data
        if: env.NEED_BUILD == 'true'
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            ~/.cache
          key: ${{ runner.os }}-buildcache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-buildcache-

      - name: Build distribution if needed
        if: env.NEED_BUILD == 'true'
        run: |
          BUILD_START=$(date +%s)
          npm ci --no-audit --no-fund --prefer-offline --no-progress
          npm run modern
          BUILD_END=$(date +%s)
          echo "Build duration: $((BUILD_END - BUILD_START))s"

      - name: Check dist output
        if: env.NEED_BUILD == 'true'
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "dist directory is empty; exiting"
            exit 1
          fi

      - name: Check push token
        if: env.NEED_BUILD == 'true'
        run: |
          if [ -z "${ACTION_TOKEN}" ]; then
            echo "ACTION_TOKEN is empty; exiting"
            exit 1
          fi
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}

      - uses: actions/checkout@v4
        if: env.NEED_BUILD == 'true'
        name: Checkout CDN Repository
        with:
          repository: ryanlee2014/CUP-Online-Judge-CDN
          path: cdn
          ref: master
          token: ${{ secrets.ACTION_TOKEN }}
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 1
          fetch-tags: false

      - name: Move file to another repository
        if: env.NEED_BUILD == 'true'
        run: |
          rm -rf cdn/*
          cp -r dist/* cdn/


      - name: Commit files and push
        if: env.NEED_BUILD == 'true'
        run: |
          cd cdn
          git config --local user.email "gxlhybh@gmail.com"
          git config --local user.name "Ryan Lee"
          git add --all
          git commit -m "deploy `TZ=UTC-8 date +'%Y-%m-%d %H:%M:%S'`"
          git tag "v`cat VERSION`"
          git push -f https://x-access-token:${{ secrets.ACTION_TOKEN }}@github.com/ryanlee2014/CUP-Online-Judge-CDN.git master
          git push --tags https://x-access-token:${{ secrets.ACTION_TOKEN }}@github.com/ryanlee2014/CUP-Online-Judge-CDN.git
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
