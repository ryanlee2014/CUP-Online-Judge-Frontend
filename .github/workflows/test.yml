name: Build distribution CI test

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4
        name: Checkout code

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm version
        run: |
          npm install -g npm@8.19.4
          npm --version

      - name: Prepare environment
        run: |
          TEST_START=$(date +%s)
          npm ci --no-audit --no-fund --prefer-offline --no-progress --legacy-peer-deps
          npm test
          TEST_END=$(date +%s)
          echo "Test duration: $((TEST_END - TEST_START))s"
        env:
          CI: true
