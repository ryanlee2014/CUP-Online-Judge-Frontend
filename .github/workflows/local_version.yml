name: Build local version

on:
  push:
    branches:
      - typescript
    paths:
      - 'package.json'
      - 'src/**'
      - 'public/**'
      - '.github/**'
      - 'vue.config.js'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ryanlee2014/CUP-Online-Judge-Frontend'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        name: Checkout code

      - name: Use Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build local distribution
        run: |
          BUILD_START=$(date +%s)
          npm ci --no-audit --no-fund
          npm run modern:local
          BUILD_END=$(date +%s)
          echo "Build duration: $((BUILD_END - BUILD_START))s"

      - name: Check dist output
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "dist directory is empty; exiting"
            exit 1
          fi

      - name: Check push token
        run: |
          if [ -z "${ACTION_TOKEN}" ]; then
            echo "ACTION_TOKEN is empty; exiting"
            exit 1
          fi
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}

      - name: Checkout repository to store local distribution
        run: |
          git clone https://x-access-token:${{ secrets.ACTION_TOKEN }}@github.com/ryanlee2014/CUP-Online-Judge-Frontend-Local.git local_build

      - name: Move file to repository
        run: |
          rm -rf local_build/*
          cp -r dist/* local_build/

      - name: Commit file and push
        run: |
          cd local_build
          git config --local user.email "gxlhybh@gmail.com"
          git config --local user.name "Ryan Lee"
          git add --all
          git commit -m "deploy `TZ=UTF-8 date +'%Y-%m-%d %H:%M:%S'`"
          git tag "v`cat VERSION`"
          git push -f https://x-access-token:${{ secrets.ACTION_TOKEN }}@github.com/ryanlee2014/CUP-Online-Judge-Frontend-Local.git master
          git push --tags https://x-access-token:${{ secrets.ACTION_TOKEN }}@github.com/ryanlee2014/CUP-Online-Judge-Frontend-Local.git

        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
