name: Build local version

on:
  push:
    branches:
      - typescript
    paths:
      - 'package.json'
      - 'src/**'
      - 'public/**'
      - '.github/**'
      - 'vue.config.js'
      - 'before_build/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ryanlee2014/CUP-Online-Judge-Frontend'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        name: Checkout code
        with:
          fetch-depth: 1
      - name: Print build env
        run: |
          node -v
          npm -v
          head -n 20 package-lock.json
          grep -n "lockfileVersion" package-lock.json || true
          grep -n "yargs-parser-5.0.0-security.0" package-lock.json || true

      - name: Use Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm version
        run: |
          npm install -g npm@8.19.4
          npm --version
      - name: Cache build tool data
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            ~/.cache
            ~/.npm
          key: ${{ runner.os }}-buildcache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-buildcache-

      - name: Build local distribution
        run: |
          BUILD_START=$(date +%s)
          npm config set registry https://registry.npmjs.org/
          if [ -d semantic/semantic-ui ]; then
            sudo chmod -R u+rwX semantic/semantic-ui
          fi
          INSTALL_START=$(date +%s)
          npm ci --no-audit --no-fund --prefer-offline --no-progress --legacy-peer-deps
          INSTALL_END=$(date +%s)
          echo "Install duration: $((INSTALL_END - INSTALL_START))s"
          BUILD_STEP_START=$(date +%s)
          npm run modern:local
          BUILD_STEP_END=$(date +%s)
          echo "Build duration: $((BUILD_STEP_END - BUILD_STEP_START))s"
          BUILD_END=$(date +%s)
          echo "Build duration: $((BUILD_END - BUILD_START))s"
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Check dist output
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "dist directory is empty; exiting"
            exit 1
          fi

      - name: Check push token
        run: |
          if [ -z "${ACTION_TOKEN}" ]; then
            echo "ACTION_TOKEN is empty; exiting"
            exit 1
          fi
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}

      - name: Checkout repository to store local distribution
        uses: actions/checkout@v4
        with:
          repository: ryanlee2014/CUP-Online-Judge-Frontend-Local
          path: local_build
          ref: master
          token: ${{ secrets.ACTION_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Move file to repository
        run: |
          rm -rf local_build/*
          cp -r dist/* local_build/

      - name: Commit file and push
        run: |
          cd local_build
          git config --local user.email "gxlhybh@gmail.com"
          git config --local user.name "Ryan Lee"
          git add --all
          git commit -m "deploy `TZ=UTF-8 date +'%Y-%m-%d %H:%M:%S'`"
          git tag "v`cat VERSION`"
          git push -f https://x-access-token:${{ secrets.ACTION_TOKEN }}@github.com/ryanlee2014/CUP-Online-Judge-Frontend-Local.git master
          git push --tags https://x-access-token:${{ secrets.ACTION_TOKEN }}@github.com/ryanlee2014/CUP-Online-Judge-Frontend-Local.git

        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
